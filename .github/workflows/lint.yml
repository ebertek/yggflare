name: Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.15"
      - name: Install formatters
        run: python -m pip install "ruff==0.14.14" "black==25.12.0"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format compliance
        run: black --check .
      - name: Python compilation
        run: python -m compileall -q controller.py backup.py src tests
