name: Publish GHCR image

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

env:
  YGG_LAN_CIDR: 10.4.20.0/23
  YGG_DEVICES_CIDR: 10.4.20.0/24
  YGG_DOCKER_CIDR: 10.4.21.0/24
  YGG_INTERNAL_DOMAIN: ygg.nu
  YGG_EXTERNAL_DOMAIN: ebi.nu
  PYTHONPATH: src/cloudflare

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - name: Install test and lint dependencies
        run: |
          python -m pip install -r src/cloudflare/requirements.txt
          python -m pip install "ruff==0.14.14" "black==25.12.0"
      - name: Validate lint and format
        run: |
          ruff check .
          black --check .
      - name: Run unit tests
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          python -m unittest discover -s src/cloudflare -p 'test_*.py'
          python -m unittest discover -s src/network-inventory -p 'test_*.py'
      - name: Verify version tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH (optional prerelease)."
            exit 1
          fi
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish verified image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/ebertek/yggflare:sha-${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && 'ghcr.io/ebertek/yggflare:main' || '' }}
            ${{ startsWith(github.ref, 'refs/tags/v') && format('ghcr.io/ebertek/yggflare:{0}', github.ref_name) || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/ebertek/yggflare
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
