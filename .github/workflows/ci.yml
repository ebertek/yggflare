name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - name: Install dependencies
        run: python -m pip install -r src/cloudflare/requirements.txt
      - name: Controller unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Cloudflare unit tests
        run: python -m unittest discover -s src/cloudflare -p 'test_*.py'
      - name: Network unit tests
        run: python -m unittest discover -s src/network-inventory -p 'test_*.py'
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build container
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
