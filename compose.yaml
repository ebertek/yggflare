services:
  yggflare:
    image: ghcr.io/ebertek/yggflare:${YGGFLARE_VERSION:-main}
    pull_policy: always
    container_name: yggflare
    restart: unless-stopped
    network_mode: host
    environment:
      TZ: UTC
      YGGFLARE_LOG_FORMAT: "${YGGFLARE_LOG_FORMAT:-text}"
      YGGFLARE_WATCH_COMPOSE: "${YGGFLARE_WATCH_COMPOSE:-true}"
      YGGFLARE_WATCH_DOCKER: "${YGGFLARE_WATCH_DOCKER:-true}"
      YGGFLARE_WATCH_POLL_SECONDS: "${YGGFLARE_WATCH_POLL_SECONDS:-15}"
      YGGFLARE_WATCH_DEBOUNCE_SECONDS: "${YGGFLARE_WATCH_DEBOUNCE_SECONDS:-20}"
      YGGFLARE_WATCH_COOLDOWN_SECONDS: "${YGGFLARE_WATCH_COOLDOWN_SECONDS:-60}"
      YGGFLARE_CONTAINER_NAME: yggflare
      YGGFLARE_CONFIG: /config
      YGGFLARE_DATA: /data
      YGGFLARE_BACKUP: /backup
      YGGFLARE_SOURCE: /compose-source
      YGGFLARE_CLOUDFLARE_AUTO_APPLY: "${YGGFLARE_CLOUDFLARE_AUTO_APPLY:-false}"
      YGGFLARE_LAN_CIDR: "${YGGFLARE_LAN_CIDR:?Set LAN discovery CIDR}"
      YGGFLARE_DEVICES_CIDR: "${YGGFLARE_DEVICES_CIDR:?Set static device CIDR}"
      YGGFLARE_DOCKER_CIDR: "${YGGFLARE_DOCKER_CIDR:?Set Docker services CIDR}"
      YGGFLARE_INTERNAL_DOMAIN: "${YGGFLARE_INTERNAL_DOMAIN:?Set internal DNS zone}"
      YGGFLARE_EXTERNAL_DOMAIN: "${YGGFLARE_EXTERNAL_DOMAIN:?Set external DNS zone}"
      PYTHONPATH: /app/cloudflare
      CLOUDFLARE_API_TOKEN_FILE: /run/secrets/cloudflare_api_token
      YGGFLARE_NETWORK_DISCORD_WEBHOOK_FILE: /run/secrets/network_discord_webhook
      CLOUDFLARE_ACCOUNT_ID: "${CLOUDFLARE_ACCOUNT_ID:?Set account ID}"
      CLOUDFLARE_TUNNEL_NAME: "${CLOUDFLARE_TUNNEL_NAME:-}"
      CLOUDFLARE_STATIC_DNS_REQUIRED: "${CLOUDFLARE_STATIC_DNS_REQUIRED:-true}"
      CLOUDFLARE_STATIC_DNS_SYNC: "${CLOUDFLARE_STATIC_DNS_SYNC:-false}"
      CLOUDFLARE_TUNNEL_ID: "${CLOUDFLARE_TUNNEL_ID:-}"
      CLOUDFLARE_EXTERNAL_ZONE_ID: "${CLOUDFLARE_EXTERNAL_ZONE_ID:-}"
      CLOUDFLARE_INTERNAL_ZONE_ID: "${CLOUDFLARE_INTERNAL_ZONE_ID:-}"
    secrets:
      - cloudflare_api_token
      - network_discord_webhook
    volumes:
      - ${YGGFLARE_HOME:?Set YGGFLARE_HOME}/config:/config:ro
      - ${YGGFLARE_HOME:?Set YGGFLARE_HOME}/data:/data
      - ${YGGFLARE_HOME:?Set YGGFLARE_HOME}/backup:/backup
      - ${YGGFLARE_MERGED_ROOT:?Set YGGFLARE_MERGED_ROOT}:/compose-source:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket:ro
    # Docker socket access is effectively host-root access.
    # Keep auto-apply off until shadow validation and cutover.

secrets:
  cloudflare_api_token:
    file: ${YGGFLARE_HOME:?Set YGGFLARE_HOME}/secrets/cloudflare_api_token
  network_discord_webhook:
    file: ${YGGFLARE_HOME:?Set YGGFLARE_HOME}/secrets/network_discord_webhook
