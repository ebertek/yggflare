services:
  yggflare:
    build: .
    image: yggflare:local
    container_name: yggflare
    restart: unless-stopped
    network_mode: host
    environment:
      TZ: ${TZ:-Europe/Stockholm}
      YGGFLARE_CONFIG: /config
      YGGFLARE_DATA: /data
      YGGFLARE_BACKUP: /backup
      YGGFLARE_SOURCE: /compose-source
      CF_AUTO_APPLY: "${CF_AUTO_APPLY:-false}"
      CLOUDFLARE_API_TOKEN_FILE: /run/secrets/cloudflare_api_token
      YGG_NETWORK_DISCORD_WEBHOOK_FILE: /run/secrets/network_discord_webhook
      CLOUDFLARE_ACCOUNT_ID: "${CLOUDFLARE_ACCOUNT_ID:-}"
      CLOUDFLARE_TUNNEL_ID: "${CLOUDFLARE_TUNNEL_ID:-}"
      CLOUDFLARE_EBI_ZONE_ID: "${CLOUDFLARE_EBI_ZONE_ID:-}"
      CLOUDFLARE_YGG_ZONE_ID: "${CLOUDFLARE_YGG_ZONE_ID:-}"
    secrets:
      - cloudflare_api_token
      - network_discord_webhook
    volumes:
      - ${YGGFLARE_HOME:?Set YGGFLARE_HOME}/config:/config:ro
      - ${YGGFLARE_HOME:?Set YGGFLARE_HOME}/data:/data
      - ${YGGFLARE_HOME:?Set YGGFLARE_HOME}/backup:/backup
      - ${YGG_MERGED_ROOT:?Set YGG_MERGED_ROOT}:/compose-source:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket:ro
    # Docker socket access is effectively host-root access.
    # Keep auto-apply off until shadow validation and cutover.

secrets:
  cloudflare_api_token:
    file: ${YGGFLARE_HOME:?Set YGGFLARE_HOME}/secrets/cloudflare_api_token
  network_discord_webhook:
    file: ${YGGFLARE_HOME:?Set YGGFLARE_HOME}/secrets/network_discord_webhook
