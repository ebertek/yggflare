services:
  yggflare:
    image: ghcr.io/ebertek/yggflare:${YGGFLARE_VERSION:-main}
    pull_policy: always
    container_name: yggflare
    restart: unless-stopped
    network_mode: host
    environment:
      TZ: UTC
      YGGFLARE_TRAEFIK_API_URL: "${YGGFLARE_TRAEFIK_API_URL:-}"
      YGGFLARE_PROBES_ENABLED: "${YGGFLARE_PROBES_ENABLED:-false}"
      YGGFLARE_PROBES_CONFIG_FILE: "${YGGFLARE_PROBES_CONFIG_FILE:-}"
      YGGFLARE_MCP_TOOL_GROUPS: "${YGGFLARE_MCP_TOOL_GROUPS:-all}"
      YGGFLARE_MCP_AUDIT_LOG: "${YGGFLARE_MCP_AUDIT_LOG:-false}"
      YGGFLARE_KOMODO_API_URL: "${YGGFLARE_KOMODO_API_URL:-}"
      YGGFLARE_KOMODO_API_KEY_FILE: "${YGGFLARE_KOMODO_API_KEY_FILE:-}"
      YGGFLARE_KOMODO_API_SECRET_FILE: "${YGGFLARE_KOMODO_API_SECRET_FILE:-}"
      YGGFLARE_KOMODO_ALLOW_HTTP: "${YGGFLARE_KOMODO_ALLOW_HTTP:-false}"
      YGGFLARE_KUMA_API_URL: "${YGGFLARE_KUMA_API_URL:-}"
      YGGFLARE_KUMA_API_KEY_FILE: "${YGGFLARE_KUMA_API_KEY_FILE:-}"
      YGGFLARE_KUMA_ALLOW_HTTP: "${YGGFLARE_KUMA_ALLOW_HTTP:-false}"
      YGGFLARE_MCP_ENABLED: "${YGGFLARE_MCP_ENABLED:-false}"
      YGGFLARE_MCP_BIND: "${YGGFLARE_MCP_BIND:-127.0.0.1}"
      YGGFLARE_MCP_PORT: "${YGGFLARE_MCP_PORT:-8788}"
      YGGFLARE_MCP_ALLOWED_HOSTS: "${YGGFLARE_MCP_ALLOWED_HOSTS:-}"
      YGGFLARE_MCP_TOKEN_FILE: "${YGGFLARE_MCP_TOKEN_FILE:-/config/mcp-token.txt}"
      YGGFLARE_DISCOVERY_INTERFACES: "${YGGFLARE_DISCOVERY_INTERFACES:-}"
      YGGFLARE_DISCOVERY_IPV6_CIDRS: "${YGGFLARE_DISCOVERY_IPV6_CIDRS:-}"
      YGGFLARE_DISCOVERY_ARP_SCAN: "${YGGFLARE_DISCOVERY_ARP_SCAN:-false}"
      YGGFLARE_DISCOVERY_NDP_PROBE: "${YGGFLARE_DISCOVERY_NDP_PROBE:-false}"
      YGGFLARE_DISCOVERY_IPV6_SCAN: "${YGGFLARE_DISCOVERY_IPV6_SCAN:-false}"
      YGGFLARE_DISCOVERY_OS_DETECTION: "${YGGFLARE_DISCOVERY_OS_DETECTION:-false}"
      YGGFLARE_DISCOVERY_SSDP: "${YGGFLARE_DISCOVERY_SSDP:-false}"
      YGGFLARE_DISCOVERY_LLDP: "${YGGFLARE_DISCOVERY_LLDP:-false}"
      YGGFLARE_DISCOVERY_NETBIOS: "${YGGFLARE_DISCOVERY_NETBIOS:-false}"
      YGGFLARE_DISCOVERY_SMB: "${YGGFLARE_DISCOVERY_SMB:-false}"
      YGGFLARE_DISCOVERY_SNMP: "${YGGFLARE_DISCOVERY_SNMP:-false}"
      YGGFLARE_DISCOVERY_P0F: "${YGGFLARE_DISCOVERY_P0F:-false}"
      YGGFLARE_DISCOVERY_SNMP_TARGETS: "${YGGFLARE_DISCOVERY_SNMP_TARGETS:-}"
      YGGFLARE_LOG_FORMAT: "${YGGFLARE_LOG_FORMAT:-text}"
      YGGFLARE_WATCH_COMPOSE: "${YGGFLARE_WATCH_COMPOSE:-true}"
      YGGFLARE_WATCH_DOCKER: "${YGGFLARE_WATCH_DOCKER:-true}"
      YGGFLARE_WATCH_POLL_SECONDS: "${YGGFLARE_WATCH_POLL_SECONDS:-15}"
      YGGFLARE_WATCH_DEBOUNCE_SECONDS: "${YGGFLARE_WATCH_DEBOUNCE_SECONDS:-20}"
      YGGFLARE_WATCH_COOLDOWN_SECONDS: "${YGGFLARE_WATCH_COOLDOWN_SECONDS:-60}"
      YGGFLARE_CLOUDFLARE_AUTO_APPLY: "${YGGFLARE_CLOUDFLARE_AUTO_APPLY:-false}"
      YGGFLARE_LAN_CIDR: "${YGGFLARE_LAN_CIDR:?Set LAN discovery CIDR}"
      YGGFLARE_DEVICES_CIDR: "${YGGFLARE_DEVICES_CIDR:?Set static device CIDR}"
      YGGFLARE_DOCKER_CIDR: "${YGGFLARE_DOCKER_CIDR:?Set Docker services CIDR}"
      YGGFLARE_INTERNAL_DOMAIN: "${YGGFLARE_INTERNAL_DOMAIN:?Set internal DNS zone}"
      YGGFLARE_EXTERNAL_DOMAIN: "${YGGFLARE_EXTERNAL_DOMAIN:?Set external DNS zone}"
      CLOUDFLARE_API_TOKEN_FILE: /run/secrets/cloudflare_api_token
      YGGFLARE_NETWORK_DISCORD_WEBHOOK_FILE: /run/secrets/network_discord_webhook
      CLOUDFLARE_ACCOUNT_ID: "${CLOUDFLARE_ACCOUNT_ID:?Set account ID}"
      CLOUDFLARE_TUNNEL_NAME: "${CLOUDFLARE_TUNNEL_NAME:-}"
      CLOUDFLARE_STATIC_DNS_REQUIRED: "${CLOUDFLARE_STATIC_DNS_REQUIRED:-true}"
      CLOUDFLARE_STATIC_DNS_SYNC: "${CLOUDFLARE_STATIC_DNS_SYNC:-false}"
      CLOUDFLARE_TUNNEL_ID: "${CLOUDFLARE_TUNNEL_ID:-}"
      CLOUDFLARE_EXTERNAL_ZONE_ID: "${CLOUDFLARE_EXTERNAL_ZONE_ID:-}"
      CLOUDFLARE_INTERNAL_ZONE_ID: "${CLOUDFLARE_INTERNAL_ZONE_ID:-}"
    secrets:
      - cloudflare_api_token
      - network_discord_webhook
    volumes:
      - ${YGGFLARE_HOME:?Set YGGFLARE_HOME}/config:/config:ro
      - ${YGGFLARE_HOME:?Set YGGFLARE_HOME}/data:/data
      - ${YGGFLARE_HOME:?Set YGGFLARE_HOME}/backup:/backup
      - ${YGGFLARE_MERGED_ROOT:?Set YGGFLARE_MERGED_ROOT}:/compose-source:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket:ro
    # Docker socket access is effectively host-root access.
    # Keep auto-apply off until shadow validation and cutover.

secrets:
  cloudflare_api_token:
    file: ${YGGFLARE_HOME:?Set YGGFLARE_HOME}/secrets/cloudflare_api_token
  network_discord_webhook:
    file: ${YGGFLARE_HOME:?Set YGGFLARE_HOME}/secrets/network_discord_webhook
